name: update-data
# Daily at 05:17 UTC (08:17 Baghdad). Each run is idempotent: it adds a new COT week only when it exists,
# and refreshes FRED liquidity/yield data. Missed runs are retried by the next day's run.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-data
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: upd
        run: python scripts/update_data.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No data changes"; else git commit -m "تحديث البيانات $(date -u +%F)"; git push; fi
      - name: Fail when data is late
        if: steps.upd.outputs.stale == 'true'
        run: |
          echo "::error::COT or FRED data is older than expected; the next scheduled run will retry."
          exit 1
